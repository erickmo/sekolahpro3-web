name: cms-rebuild
on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch: {}

concurrency:
  group: cms-rebuild
  cancel-in-progress: true

jobs:
  rebuild-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - name: Log trigger
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          DOCTYPE: ${{ github.event.client_payload.doctype }}
          DOC_NAME: ${{ github.event.client_payload.name }}
        run: |
          echo "Triggered by: $SOURCE"
          echo "Doctype:      $DOCTYPE"
          echo "Name:         $DOC_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sekolahpro/app-landing build
      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }} }
      - name: Add deploy host to known_hosts
        env: { DEPLOY_HOST: "${{ secrets.DEPLOY_HOST }}" }
        run: ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Rsync landing dist
        env:
          DEPLOY_HOST: "${{ secrets.DEPLOY_HOST }}"
          TARGET_DIR:  "${{ secrets.DEPLOY_TARGET_DIR }}"
        run: |
          rsync -az --delete apps/landing/dist/ \
            "deploy@${DEPLOY_HOST}:${TARGET_DIR:-/srv/sekolahpro-web}/landing/"
